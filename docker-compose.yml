name: eduflow-ai
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-application: &application
  image: ${EDUFLOW_APP_IMAGE:-eduflow-local:privacy}
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  logging: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs: [/tmp]
  environment: &runtime
    DATABASE_URL_FILE: /run/secrets/application_database
    REDIS_URL_FILE: /run/secrets/redis_url
    AGENT_MODE: offline
    PUBLIC_ACCESS_ENABLED: "false"
    ORGANIZATION_SLUG: ${ORGANIZATION_SLUG:-demo}
    INITIALIZATION_MODE: ${INITIALIZATION_MODE:-demo}
    PRIVATE_DIR: /private
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    logging: *logging
    image: ${EDUFLOW_POSTGRES_IMAGE:-eduflow-postgres:16.16-alpine-r2}
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduflow}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-eduflow_ai}
    secrets: [postgres_password]
    ports: ["127.0.0.1:${EDUFLOW_POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    logging: *logging
    image: ${EDUFLOW_REDIS_IMAGE:-eduflow-redis:7.4.12-r2}
    build: ./infra/redis
    command: [redis-server, --appendonly, "yes", --aclfile, /run/secrets/redis_acl]
    secrets: [redis_acl, redis_health]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_health)" redis-cli --user health PING | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    <<: *application
    environment:
      <<: *runtime
      PORTAL: WORKER
      BACKUP_KEY_FILE: /run/secrets/backup_key
    secrets: [application_database, redis_url, backup_key]
    volumes: [./.runtime/private/backups:/private/backups]
    command: [celery, -A, eduflow.bootstrap.worker:celery_app, worker, --loglevel=WARNING, --concurrency=2]
  beat:
    <<: *application
    environment:
      <<: *runtime
      PORTAL: WORKER
    secrets: [application_database, redis_url]
    command: [celery, -A, eduflow.bootstrap.worker:celery_app, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
  admin-api:
    <<: *application
    environment:
      <<: *runtime
      PORTAL: ADMIN
      JWT_SECRET_FILE: /run/secrets/admin_signing
      PORTAL_ORIGIN: http://127.0.0.1:${EDUFLOW_ADMIN_PORT:-8000}
    secrets: [application_database, redis_url, admin_signing]
    ports: ["127.0.0.1:${EDUFLOW_ADMIN_PORT:-8000}:8000"]
    command: [uvicorn, eduflow.bootstrap.app:create_admin_app, --factory, --host, "0.0.0.0", --port, "8000", --no-proxy-headers, --no-access-log, --timeout-keep-alive, "15"]
    healthcheck: &api-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 30
  public-api:
    <<: *application
    environment:
      <<: *runtime
      PORTAL: PUBLIC
      JWT_SECRET_FILE: /run/secrets/public_signing
      PORTAL_ORIGIN: http://127.0.0.1:${EDUFLOW_PUBLIC_PORT:-8100}
    secrets: [application_database, redis_url, public_signing]
    ports: ["127.0.0.1:${EDUFLOW_PUBLIC_PORT:-8100}:8000"]
    command: [uvicorn, eduflow.bootstrap.app:create_public_app, --factory, --host, "0.0.0.0", --port, "8000", --no-proxy-headers, --no-access-log, --timeout-keep-alive, "15"]
    healthcheck: *api-health
  maintenance:
    <<: *application
    profiles: [tools]
    environment:
      PORTAL: WORKER
      DATABASE_URL_FILE: /run/secrets/maintenance_database
      BACKUP_KEY_FILE: /run/secrets/backup_key
      PRIVATE_DIR: /private
    secrets: [maintenance_database, backup_key]
    # Backup/restore uses only PostgreSQL; this process needs no queue credential.
    volumes: [./.runtime/private/backups:/private/backups]
    command: [python, -m, eduflow.bootstrap.cli, backup]
secrets:
  redis_url:
    file: ./.runtime/private/secrets/redis.url
  redis_acl:
    file: ./.runtime/private/secrets/redis.acl
  redis_health:
    file: ./.runtime/private/secrets/redis-health.password
  postgres_password:
    file: ./.runtime/private/secrets/postgres.password
  application_database:
    file: ./.runtime/private/secrets/application.url
  maintenance_database:
    file: ./.runtime/private/secrets/maintenance.url
  admin_signing:
    file: ./.runtime/private/secrets/admin.key
  public_signing:
    file: ./.runtime/private/secrets/public.key
  backup_key:
    file: ./.runtime/private/secrets/backup.key
volumes:
  postgres_data:
  redis_data:
