[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eduflow-ai"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a dedicated PostgreSQL test database", "performance: full seeded solver workload"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["eduflow", "support", "run", "prepare_test_database"]
known-third-party = ["alembic"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["eduflow"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no infrastructure dependencies"
type = "forbidden"
source_modules = ["eduflow.domain"]
forbidden_modules = ["eduflow.application", "eduflow.adapters", "eduflow.bootstrap", "fastapi", "sqlalchemy", "pydantic", "ortools", "celery", "httpx"]

[[tool.importlinter.contracts]]
name = "Application depends on ports and domain"
type = "forbidden"
source_modules = ["eduflow.application"]
forbidden_modules = ["eduflow.adapters", "eduflow.bootstrap", "fastapi", "sqlalchemy", "pydantic", "ortools", "celery", "httpx"]
